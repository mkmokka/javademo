<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Multiplayer Chess Cloud</title>
    <script src="https://cloudflare.com"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #222; color: #fff; }
        .menu, .game-area { margin: 20px auto; max-width: 500px; }
        .board { display: grid; grid-template-columns: repeat(8, 50px); grid-template-rows: repeat(8, 50px); width: 400px; margin: 20px auto; border: 2px solid #fff; }
        .square { width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; }
        .light { background: #eeeed2; color: #000; }
        .dark { background: #769656; color: #fff; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; margin: 5px; }
        input { padding: 10px; font-size: 16px; }
    </style>
</head>
<body>
    <h1>♟️ Advanced AI & Live Chess</h1>
    <div id="menu" class="menu">
        <button onclick="createGame('COMPUTER')">Play with Computer</button><br><br>
        <button onclick="createGame('FRIEND')">Create Friend Room</button><br><br>
        <input type="text" id="roomCode" placeholder="Enter Unique Code">
        <button onclick="joinGame()">Join Room</button>
    </div>
    <div id="game-area" class="game-area" style="display:none;">
        <h3>Room Code: <span id="displayId"></span></h3>
        <h4 id="status">Status: Waiting...</h4>
        <div id="board" class="board"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
